/* ═════════ PAGE DE L'ENSEIGNANTE (?prof) */
function prof(){
  document.body.className = 'prof';
  var code = sessionStorage.getItem('gdp-classe-code') || String(1000 + Math.floor(Math.random()*9000));
  sessionStorage.setItem('gdp-classe-code', code);
  var ch = client.channel('gdp-classe-' + code, { config:{ broadcast:{ self:false }, presence:{ key:'prof' } } });
  var eleves = {}, cur = null, reps = {}, faites = {}, points = {}, montre = false, qid = 0, libres = [];
  function nomsEleves(){ var st = ch.presenceState(), o = {}; Object.keys(st).forEach(function(k){ if(k!=='prof' && st[k][0]) o[k] = st[k][0].nom; }); eleves = o; }
  function envoyer(ev, p){ ch.send({ type:'broadcast', event:ev, payload:p }); }
  function payloadQ(){ return cur ? { id:cur.id, consigne:cur.q.consigne, texte:cur.q.texte, choix:cur.q.choix||null } : null; }
  function lancer(i, q){ qid++; cur = { id: qid, i: i, q: q }; reps = {}; montre = false; faites[i] = 1; envoyer('q', payloadQ()); rendu(); }
  function corriger(){
    if(!cur) return; montre = true; var res = {};
    Object.keys(reps).forEach(function(s){ res[s] = reps[s].j; });
    var bons = Object.keys(reps).filter(function(s){ return reps[s].j === 'ok'; }).sort(function(a, b){ return reps[a].t - reps[b].t; });
    var gain = {}, rang = {};
    bons.forEach(function(s, i){ gain[s] = i === 0 ? 3 : i === 1 ? 2 : 1; rang[s] = i + 1; if (!cur.compte) points[s] = (points[s]||0) + gain[s]; });
    cur.compte = true; cur.podium = bons.slice(0, 3).map(function(s){ return [reps[s].nom, gain[s]]; });
    envoyer('corr', { id:cur.id, rep:cur.q.rep, res:res, gain:gain, rang:rang }); rendu();
  }
  function rendu(){
    var n = Object.keys(eleves).length, nr = Object.keys(reps).length;
    var h = '<div class="haut"><div><h1>Classe en direct</h1><div class="petit">Sur le téléphone : <b>grainesdepalestine.github.io/classe</b></div></div>'
      + '<div class="code">' + code + '</div><div class="ar" style="font-size:22px">رمز الصف</div></div>'
      + '<div class="carte"><b>Connectées : ' + n + '</b><div class="eleves" style="margin-top:8px">'
      + (n ? Object.keys(eleves).map(function(k){ return '<span>' + esc(eleves[k]) + '</span>'; }).join('') : '<span class="petit" style="background:none">Personne pour le moment…</span>') + '</div></div>'
      + '<div class="cols"><div class="carte liste"><b>Les questions</b> <span class="petit">(manuel p. 3 à 10)</span>';
    var g = '';
    QUESTIONS.concat(libres).forEach(function(q, i){
      if (q.g !== g){ g = q.g; h += '<div class="petit" style="margin-top:10px">' + esc(g) + '</div>'; }
      h += '<button data-i="' + i + '" class="' + (cur && cur.i === i ? 'active' : faites[i] ? 'faite' : '') + '"><span class="t">' + (i+1) + '.</span> ' + q.texte.replace(/<br>.*/,'') + (q.dire ? ' <span class="petit">(dis « ' + esc(q.dire) + ' »)</span>' : '') + '</button>';
    });
    h += '<div class="petit" style="margin-top:12px">Question libre (réponses acceptées séparées par /)</div>'
      + '<input id="lq" placeholder="Phrase ou mot à traduire" style="font-size:17px;margin-top:4px"><input id="lr" placeholder="Réponse 1 / réponse 2" style="font-size:17px;margin-top:6px">'
      + '<button id="lgo" style="background:var(--vert);color:#fff;margin-top:6px;text-align:center;font-weight:700">Ajouter et envoyer</button></div>';
    h += '<div class="carte">';
    if (!cur) h += '<p class="attente">Clique sur une question à gauche pour l’envoyer sur les téléphones.</p>';
    else {
      h += '<p class="consigne">' + esc(cur.q.consigne) + '</p><div class="texte' + (isAr(cur.q.texte) ? ' ar' : '') + '">' + cur.q.texte + '</div>'
        + (cur.q.dire ? '<div class="dire">🗣️ Dis à voix haute, 2 fois : <b>« ' + esc(cur.q.dire) + ' »</b></div>' : '')
        + '<p><b>Réponses : ' + nr + ' / ' + n + '</b>' + (montre ? ' · Bonne réponse : <b>' + esc(cur.q.rep) + '</b>' : '') + '</p>';
      Object.keys(reps).forEach(function(s){ var r = reps[s];
        h += '<div class="rep ' + r.j + '" data-s="' + s + '"><b>' + esc(r.nom) + '</b><span class="r">' + esc(r.txt) + '</span><span>' + (r.j==='ok'?'✅':r.j==='presque'?'🟡 presque':'❌') + '</span></div>'; });
      if (montre) h += '<div class="podium">⚡ Les plus rapides<div>' + (cur.podium && cur.podium.length ? cur.podium.map(function(x, i){ return '<span>' + ['🥇','🥈','🥉'][i] + ' ' + esc(x[0]) + ' <small>+' + x[1] + ' ⭐</small></span>'; }).join('') : '<span>Personne cette fois !</span>') + '</div></div>';
      if (nr && !montre) h += '<div class="petit">Une réponse mal jugée ? Clique dessus pour la changer (avant « Montrer la réponse »).</div>';
      h += '<div class="barre"><button id="corr">✅ Montrer la réponse</button><button id="suiv" class="sec">➡️ Question suivante</button><button id="pause" class="sec">⏸️ Écran d’attente</button><button id="clas" class="sec">🏆 Classement</button></div>';
    }
    h += '<div id="classement"></div></div></div>';
    el(h);
    app.querySelectorAll('.liste button[data-i]').forEach(function(b){ b.onclick = function(){ var i = +b.dataset.i; lancer(i, QUESTIONS.concat(libres)[i]); }; });
    app.querySelectorAll('.rep').forEach(function(d){ d.onclick = function(){ if (montre) return; var r = reps[d.dataset.s]; r.j = r.j === 'ok' ? 'ko' : 'ok'; rendu(); }; });
    var b;
    if ((b = document.getElementById('lgo'))) b.onclick = function(){ var t = document.getElementById('lq').value.trim(), r = document.getElementById('lr').value.trim(); if(!t || !r) return;
      var oks = r.split('/').map(function(x){ return x.trim(); }).filter(Boolean);
      libres.push({ g:'Questions libres', consigne: isAr(t) ? TR : 'Réponds en français · أجيبي بالفرنسية', texte: esc(t), ok: oks, rep: oks[0] }); lancer(QUESTIONS.length + libres.length - 1, libres[libres.length-1]); };
    if ((b = document.getElementById('corr'))) b.onclick = corriger;
    if ((b = document.getElementById('suiv'))) b.onclick = function(){ var t = QUESTIONS.concat(libres), i = cur.i + 1; if (i < t.length) lancer(i, t[i]); };
    if ((b = document.getElementById('pause'))) b.onclick = function(){ cur = null; envoyer('pause', {}); rendu(); };
    if ((b = document.getElementById('clas'))) b.onclick = function(){
      var t = Object.keys(eleves).map(function(s){ return [eleves[s], points[s]||0]; }).sort(function(a,b){ return b[1]-a[1]; });
      document.getElementById('classement').innerHTML = '<h2>🏆 Classement</h2><table>' + t.map(function(x,i){ return '<tr><td>' + (i<3?['🥇','🥈','🥉'][i]:i+1) + '</td><td>' + esc(x[0]) + '</td><td><b>' + x[1] + '</b> ⭐</td></tr>'; }).join('') + '</table>';
    };
  }
  ch.on('presence', { event:'sync' }, function(){ nomsEleves(); rendu(); })
    .on('broadcast', { event:'r' }, function(m){ var p = m.payload; if (!cur || p.id !== cur.id || montre) return;
      if (reps[p.sid]) return; reps[p.sid] = { nom:p.nom, txt:p.txt, t:Date.now(), j: cur.q.libre ? (/\bans?\b/.test(norm(p.txt)) ? 'ok' : 'presque') : juger(p.txt, cur.q.ok) }; rendu(); })
    .on('broadcast', { event:'hello' }, function(){ if (cur) envoyer('q', payloadQ()); if (cur && montre) corriger(); })
    .subscribe(function(st){ if (st === 'SUBSCRIBED') ch.track({ nom:'prof' }); });
  rendu();
}

/* ═════════ PAGE DES ÉLÈVES */
function eleve(){
  var sid = sessionStorage.getItem('gdp-classe-sid') || Math.random().toString(36).slice(2, 10);
  sessionStorage.setItem('gdp-classe-sid', sid);
  var params = new URLSearchParams(location.search);
  var code0 = params.get('code') || localStorage.getItem('gdp-classe-code') || '', nom0 = localStorage.getItem('gdp-classe-nom') || '';
  function entree(err){
    el('<h1>Classe en direct</h1><p class="ar" style="margin:0">الصف المباشر</p><div class="carte">'
      + '<label>Le code de la classe · <span class="ar">رمز الصف</span></label><input id="c" inputmode="numeric" maxlength="4" value="' + esc(code0) + '" placeholder="1234">'
      + '<label>Ton prénom · <span class="ar">اسمكِ</span></label><input id="n" maxlength="20" value="' + esc(nom0) + '">'
      + '<button class="gros" id="go">Entrer · <span class="ar">دخول</span></button>' + (err ? '<div class="err">' + err + '</div>' : '') + '</div>');
    document.getElementById('go').onclick = function(){
      var c = document.getElementById('c').value.replace(/\D/g,''), n = document.getElementById('n').value.trim();
      if (c.length !== 4 || !n) return entree('Écris le code (4 chiffres) et ton prénom. · اكتبي الرمز واسمكِ.');
      localStorage.setItem('gdp-classe-code', c); localStorage.setItem('gdp-classe-nom', n); code0 = c; nom0 = n; sessionStorage.setItem('gdp-classe-dedans', '1'); salle(c, n);
    };
  }
  function salle(code, nom){
    var ch = client.channel('gdp-classe-' + code, { config:{ broadcast:{ self:false }, presence:{ key:sid } } });
    var q = null, envoye = false, profVu = false;
    function attente(t){ el('<h1>Bonjour ' + esc(nom) + ' !</h1><div class="carte attente">' + t + '</div><p class="petit" style="text-align:center">Code ' + code + ' · <a href="#" id="sortir">changer</a></p>');
      document.getElementById('sortir').onclick = function(e){ e.preventDefault(); ch.unsubscribe(); sessionStorage.removeItem('gdp-classe-dedans'); code0 = ''; entree(); }; }
    function question(){
      var h = '<div class="carte"><p class="consigne">' + esc(q.consigne) + '</p><div class="texte' + (isAr(q.texte) ? ' ar' : '') + '">' + q.texte + '</div>';
      if (q.choix) h += '<div class="choix">' + q.choix.map(function(c, i){ return '<button data-c="' + i + '">' + esc(c) + '</button>'; }).join('') + '</div>';
      else h += '<input id="t" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…"><button class="gros" id="env">Envoyer · <span class="ar">أرسلي</span></button>';
      el(h + '</div>');
      function envoyer(txt){ if (envoye || !txt.trim()) return; envoye = true; ch.send({ type:'broadcast', event:'r', payload:{ id:q.id, sid:sid, nom:nom, txt:txt.trim() } });
        attente('✅ Envoyé ! · <span class="ar">تم الإرسال</span><br><br>⏳ <span class="ar">انتظري…</span>'); }
      if (q.choix) app.querySelectorAll('.choix button').forEach(function(b){ b.onclick = function(){ b.classList.add('pris'); setTimeout(function(){ envoyer(q.choix[+b.dataset.c]); }, 150); }; });
      else { var t = document.getElementById('t'); t.focus(); document.getElementById('env').onclick = function(){ envoyer(t.value); }; t.onkeydown = function(e){ if (e.key === 'Enter') envoyer(t.value); }; }
    }
    ch.on('broadcast', { event:'q' }, function(m){ if (!m.payload) return; if (q && q.id === m.payload.id) return; q = m.payload; envoye = false; question(); })
      .on('broadcast', { event:'pause' }, function(){ q = null; attente('⏳ Attends la question… · <span class="ar">انتظري السؤال…</span>'); })
      .on('broadcast', { event:'corr' }, function(m){ var p = m.payload; if (!q || p.id !== q.id) return;
        var j = p.res[sid], h;
        if (j === 'ok') { var rg = (p.rang||{})[sid], g = (p.gain||{})[sid] || 1;
          h = '<div class="msg ok">' + (rg && rg <= 3 ? ['🥇','🥈','🥉'][rg-1] + ' ' : '⭐ ') + 'Bravo ! · <span class="ar">ممتاز!</span><br><b>+' + g + ' ⭐</b>' + (rg === 1 ? '<br>La plus rapide ! · <span class="ar">الأسرع!</span>' : '') + '</div>'; }
        else if (j === 'presque') h = '<div class="msg presque">Tu y es presque ! · <span class="ar">قريب جدًا!</span><br><b>' + esc(p.rep) + '</b></div>';
        else if (j === 'ko') h = '<div class="msg ko">La réponse · <span class="ar">الجواب</span><br><b>' + esc(p.rep) + '</b></div>';
        else h = '<div class="msg presque">La réponse · <span class="ar">الجواب</span><br><b>' + esc(p.rep) + '</b></div>';
        el('<div class="carte"><p class="consigne">' + esc(q.consigne) + '</p><div class="texte' + (isAr(q.texte) ? ' ar' : '') + '">' + q.texte + '</div>' + h + '</div><p class="attente">⏳ <span class="ar">انتظري السؤال التالي…</span></p>'); })
      .on('presence', { event:'sync' }, function(){ profVu = !!ch.presenceState().prof; })
      .subscribe(function(st){
        if (st === 'SUBSCRIBED') { ch.track({ nom:nom }); ch.send({ type:'broadcast', event:'hello', payload:{} });
          if (!q) attente('⏳ Attends la question… · <span class="ar">انتظري السؤال…</span>');
          setTimeout(function(){ if (!profVu && !q) attente('Le cours n’a pas encore commencé, ou le code n’est pas bon.<br><span class="ar">لم يبدأ الدرس بعد، أو الرمز غير صحيح.</span>'); }, 4000); }
        if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') attente('Connexion… · <span class="ar">جارٍ الاتصال…</span>');
      });
  }
  if (sessionStorage.getItem('gdp-classe-dedans') && code0 && nom0) salle(code0, nom0); else entree();
}

if (!window.supabase) el('<div class="carte err">Pas de connexion internet. · لا يوجد اتصال بالإنترنت.</div>');
else if (new URLSearchParams(location.search).has('prof')) prof(); else eleve();
</script>
