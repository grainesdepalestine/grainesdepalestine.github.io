<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graines de Palestine — Premiers pas en France</title>
<link rel="icon" href="img/pousse.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Kalam:wght@700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
/* Same universe as the activities (epeler/): white page, forest/teal greens, Kalam titles, Andika text */
:root{
  color-scheme: light;
  --white:#ffffff; --ink:#151a18; --forest:#1f3d33; --teal:#1e6b59; --leaf:#2f8a6e;
  --mist:#eef4f1; --line:#d5e2dc; --red:#c8213f;
  --hand:"Kalam","Comic Sans MS",cursive;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --ar:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-weight:400}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:22px}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;border-bottom:3px solid var(--forest);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.badge{width:76px;height:76px;border-radius:50%;border:4px solid var(--forest);background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.badge img{width:58px;height:58px;object-fit:contain}
h1{font-family:var(--hand);font-size:clamp(1.7rem,5vw,2.4rem);margin:0;line-height:1.05;color:var(--forest)}
.sub{margin:2px 0 0;font-size:1rem}
.sub .ar,h1 .ar{display:block}
.sub .ar{text-align:left}
h1 .ar{text-align:left;font-size:1.15rem;color:var(--teal);margin-top:2px}
.logo-full{height:64px;width:auto}

.search{display:block;width:100%;font-family:var(--body);font-size:1.15rem;padding:10px 16px;border:3px solid var(--forest);border-radius:14px;color:var(--ink);background:#fff}
.search:focus{outline:3px solid var(--leaf);outline-offset:2px}

section.unit{display:flex;flex-direction:column;gap:12px}
.unit-head{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;border-radius:50%;padding:4px;background:conic-gradient(var(--red) 0 33%,var(--ink) 0 66%,var(--leaf) 0);flex:none}
.unit.empty-unit .ring{background:#d9dfdc}
.disc{width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,var(--forest),var(--teal));display:grid;place-items:center;color:#fff;font-family:var(--hand);font-size:1.6rem;line-height:1}
.unit-head small{display:block;font-size:.9rem;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.unit-head small .ar{display:inline;font-size:.95rem;color:inherit}
.unit-head h2 + .ar{display:block;text-align:left;font-size:1.15rem;color:var(--teal);line-height:1.3}
.unit-head h2{font-family:var(--hand);font-size:1.6rem;margin:4px 0 0;color:var(--forest);line-height:1.1}

.grid{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-left:78px}
.tile{display:flex;align-items:center;gap:14px;width:100%;max-width:520px;padding:10px 22px 10px 10px;text-decoration:none;color:#fff;background:linear-gradient(100deg,var(--red),#e0455f);border-radius:999px;font-size:1.2rem;font-weight:700;line-height:1.2;box-shadow:0 4px 0 #8f1229;animation:pulse 2.4s ease-in-out infinite;transition:transform .15s}
.tile .icon{width:52px;height:52px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.7rem;line-height:1}
.tile .txt{display:flex;flex-direction:column;flex:1;min-width:0}
.tile .ar{font-size:1.1rem;color:#fff;opacity:.95;text-align:left}
.tile .go{font-size:1.6rem;flex:none}
a.tile:hover{transform:translateY(-2px) scale(1.02);animation-play-state:paused}
a.tile:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
.tile.soon{background:var(--mist);color:#56645e;box-shadow:none;animation:none;cursor:default}
.tile.soon .ar{color:#56645e}
.tile small{font-size:.85rem;font-weight:400}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #8f1229,0 0 0 0 rgba(200,33,63,.45)}50%{box-shadow:0 4px 0 #8f1229,0 0 0 10px rgba(200,33,63,0)}}
.empty{margin-left:78px;padding:12px 16px;border:2px dashed var(--line);border-radius:16px;color:#56645e;font-size:1rem}

footer{border-top:1px solid var(--line);padding-top:12px;font-size:.9rem;text-align:center}
@media (max-width:520px){
  .logo-full{display:none}
  .grid{padding-left:0}
  .empty{margin-left:0}
  .ring{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none;animation:none}a.tile:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="badge"><img src="img/pousse.png" alt=""></div>
      <div>
        <h1>Premiers pas en France<span class="ar">خطوات أولى في فرنسا</span></h1>
        <p class="sub">Français A1 — choisis une activité <span class="ar">اختر نشاطًا</span></p>
      </div>
    </div>
    <img class="logo-full" src="img/logo.png" alt="Graines de Palestine">
  </header>

  <input class="search" id="search" type="search" placeholder="🔎 Chercher… / ابحث" aria-label="Chercher une activité">

  <div id="units" style="display:flex;flex-direction:column;gap:26px"></div>

  <footer>Graines de Palestine · Premiers pas en France</footer>
</div>

<script src="activites.js"></script>
<script>
  const units = window.ACTIVITES || [];
  const box = document.getElementById("units");
  const search = document.getElementById("search");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function render(q) {
    q = (q || "").trim().toLowerCase();
    let html = "";
    let found = 0;
    for (const u of units) {
      const list = u.activites.filter(a => !q || [a.titre, a.ar, u.titre, u.ar].join(" ").toLowerCase().includes(q));
      if (q && !list.length) continue;
      found += list.length;
      const num = String(u.unite).replace(/\D/g, "");
      const live = u.activites.some(a => a.lien);
      html += `<section class="unit${live ? "" : " empty-unit"}"><div class="unit-head"><span class="ring"><span class="disc">${esc(u.badge || num)}</span></span><div><small>${esc(u.unite)} · <span class="ar">${esc(u.uniteAr || ("الوحدة " + num))}</span></small><h2>${esc(u.titre || "").replace(/ ([?!:;])/g, " $1")}</h2>${u.ar ? `<span class="ar">${esc(u.ar)}</span>` : ""}</div></div>`;
      html += list.length
        ? `<div class="grid">` + list.map(a => a.lien
            ? `<a class="tile" href="${esc(a.lien)}"><span class="icon">${esc(a.icone || "📘")}</span><span class="txt">${esc(a.titre)}${a.ar ? `<span class="ar">${esc(a.ar)}</span>` : ""}</span><span class="go" aria-hidden="true">→</span></a>`
            : `<div class="tile soon"><span class="icon">${esc(a.icone || "📘")}</span><span class="txt">${esc(a.titre)}${a.ar ? `<span class="ar">${esc(a.ar)}</span>` : ""}<small>Bientôt · <span class="ar">قريبًا</span></small></span></div>`
          ).join("") + `</div>`
        : `<div class="empty">Bientôt disponible · <span class="ar">قريبًا</span></div>`;
      html += `</section>`;
    }
    if (q && !found) html = `<div class="empty" style="margin:0">Aucune activité trouvée. <span class="ar">لا يوجد نشاط.</span></div>`;
    box.innerHTML = html;
  }

  search.addEventListener("input", () => render(search.value));
  render();
</script>
<script>if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});}</script>
</body>
</html>
