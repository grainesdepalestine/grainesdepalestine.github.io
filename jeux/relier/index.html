<style>/* Boîte à jeux : styles communs + deux habillages (Calamots, Graines de Palestine) */
:root,[data-theme="calamots"]{
  --fond:#EAF6FF;--page:#fff;--entete:#BDE6FF;--titre:#0B4F8A;--texte:#1D2B3A;
  --carte:#FFF3D1;--bord:#FFC93C;--brun:#7A4B00;--bouton:#2BB673;--bouton-txt:#062B19;
  --alt:#BDE6FF;--alt-txt:#0B4F8A;--ok:#1E8E57;--ok-bg:#E1F7EA;--ko:#C0392B;--ko-bg:#FDE7E3;
  --accent:#F28C00;--pied:#2BB673;--pied-txt:#062B19;
  --t-titre:'Baloo 2',sans-serif;--t-corps:Nunito,system-ui,sans-serif;--t-ar:'Noto Naskh Arabic',serif;
}
[data-theme="graines"]{
  --fond:#eef4f1;--page:#fff;--entete:#1f3d33;--titre:#1f3d33;--texte:#151a18;
  --carte:#ffffff;--bord:#d5e2dc;--brun:#1e6b59;--bouton:#2f8a6e;--bouton-txt:#fff;
  --alt:#eef4f1;--alt-txt:#1f3d33;--ok:#1e6b59;--ok-bg:#e3f2ec;--ko:#c8213f;--ko-bg:#fbe6ea;
  --accent:#c8213f;--pied:#1f3d33;--pied-txt:#fff;
  --t-titre:Kalam,cursive;--t-corps:Andika,system-ui,sans-serif;--t-ar:'Noto Naskh Arabic',serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--t-corps);font-size:18px;line-height:1.5;color:var(--texte);background:var(--fond)}
.wrap{max-width:760px;margin:0 auto;min-height:100vh;background:var(--page);display:flex;flex-direction:column}
header{background:var(--entete);padding:16px 18px 14px}
[data-theme="graines"] header{color:#fff}
.marque{display:inline-block;border-radius:10px;padding:1px 12px;font-weight:800;font-size:15px;background:var(--titre);color:#fff}
[data-theme="graines"] .marque{background:#c8213f}
h1{margin:6px 0 0;font-family:var(--t-titre);font-weight:800;font-size:clamp(28px,7vw,42px);line-height:1.1;color:var(--titre)}
[data-theme="graines"] h1{color:#fff}
.consigne-g{font-weight:700;margin-top:4px}
.ar{font-family:var(--t-ar);direction:rtl;unicode-bidi:isolate;font-size:1.05em}
.sous-ar{display:block;opacity:.9;font-weight:400}
main{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:14px}
footer{background:var(--pied);color:var(--pied-txt);padding:8px 18px;font-size:14px;font-weight:700}
.carte{background:var(--carte);border:3px solid var(--bord);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lh{font-family:var(--t-titre);font-weight:800;font-size:22px;color:var(--brun)}
.texte{background:#fff;border-radius:14px;padding:12px 14px;font-size:20px;line-height:2.3}
[data-theme="graines"] .texte{border:2px solid var(--bord)}
.go{font:inherit;font-family:var(--t-titre);font-weight:800;font-size:19px;min-height:50px;padding:6px 22px;border:0;border-radius:14px;background:var(--bouton);color:var(--bouton-txt);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.go.alt{background:var(--alt);color:var(--alt-txt)}
.go:disabled{background:#D5DBE1;color:#5B6672;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.opt{font:inherit;font-size:19px;font-weight:800;min-height:50px;min-width:90px;padding:8px 16px;border-radius:14px;border:3px solid var(--titre);background:#fff;color:var(--texte);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.fb{border-radius:14px;padding:10px 14px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.ko{background:var(--ko-bg);color:var(--ko)}
.prog{height:10px;border-radius:6px;background:#E3EEF6;overflow:hidden}.prog i{display:block;height:100%;background:var(--bouton);transition:width .4s}
button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.son{font:inherit;border:0;background:var(--alt);color:var(--alt-txt);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;font-size:20px}
/* fin */
.medal{margin:0 auto;width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid var(--bouton);background:var(--ok-bg);color:var(--ok)}
.medal.moyen{border-color:var(--accent);background:#FFF1DE;color:#7A3E00}
.ms{font-family:var(--t-titre);font-weight:800;font-size:40px;line-height:1}.ml{font-weight:800;font-size:14px;text-align:center}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
/* marquer / chasse */
.mk{cursor:pointer;border-radius:6px;padding:2px 0}
.mk:hover{background:#FFF3D1}
.mk.souligne{border-bottom:4px solid var(--c)}
.mk.rond{outline:3px solid var(--c);outline-offset:1px;border-radius:14px;padding:2px 4px}
.mk.manque{border-bottom-style:dashed;outline-style:dashed}
.mk.faux{text-decoration:line-through;text-decoration-color:var(--ko);text-decoration-thickness:3px}
.mk.pris{background:#FFD9B0;outline:3px solid var(--accent)}
.mk.fausse{background:#FFF1DE;outline:3px solid #F28C00}
.mk.erreur{color:var(--ko);text-decoration:line-through}
